<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Aptis Speaking · Plantillas B2</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title">Aptis Speaking · Plantillas B2</h1>
      <p class="app-subtitle" id="app-subtitle">Estructuras que se adaptan a cualquier tema</p>
    </div>

    <!-- Navegación de partes -->
    <nav class="part-nav" id="part-nav" role="tablist" aria-label="Partes del examen">
      <!-- Se rellena dinámicamente: Parte 1, 2, 3, 4, Vocabulario, Estrategia, Progreso -->
    </nav>
  </header>

  <main class="app-main" id="app-main">
    <!-- El contenido se monta aquí dinámicamente según la parte/sección seleccionada -->
    <p class="loading">Cargando contenido…</p>
  </main>

  <!-- Pie discreto con selector de modo (solo visible en partes 1-4) -->
  <footer class="mode-footer" id="mode-footer" hidden>
    <div class="mode-tabs" role="tablist" aria-label="Modo de estudio">
      <button class="mode-tab active" data-mode="aprender"   role="tab">📚 Aprender</button>
      <button class="mode-tab"        data-mode="aplicado"   role="tab">🔄 Ver aplicado</button>
      <button class="mode-tab"        data-mode="practicar"  role="tab">🎯 Practicar</button>
    </div>
  </footer>

  <script src="js/scorm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
